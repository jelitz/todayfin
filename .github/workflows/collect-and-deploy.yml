name: Collect and deploy (data pipeline)

# 장전(preopen)/장후(afterclose) cron 또는 수동 실행으로 pipeline/collect.py를 돌리고,
# 결과를 data/에 커밋한 뒤 같은 잡 안에서 web을 빌드해 Pages까지 배포한다.
# GITHUB_TOKEN으로 만든 커밋은 다른 워크플로우(push 트리거)를 일으키지 않으므로
# (Stage 1에서 실측 확인, docs/specs/dashboard-mvp/implemented.md 참조) 배포를
# push 트리거에 의존하지 않고 이 잡 안에서 직접 완결한다.
#
# 정각 회피 오프셋(GitHub cron은 정시를 보장하지 않고 정각 부하가 큼):
#   10 23 * * 0-5 (UTC) = KST 월~토 08:10 → preopen (미국채·WTI·환율)
#   40  9 * * 1-5 (UTC) = KST 평일 18:40 → afterclose (국내 지수·종목·수급·국고채)
#   */30 0-6 * * 1-5 (UTC) = KST 평일 09:00~15:30(정규장) 30분 간격 → market_hours
#     (수급 2종·코스피 등 4종·환율/WTI 3종 — 국채 4종은 하루 1회 고시값이라 제외.
#     docs/specs/near-realtime-updates 참조)

on:
  schedule:
    - cron: "10 23 * * 0-5"
    - cron: "40 9 * * 1-5"
    - cron: "*/30 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      profile:
        description: "수집 프로필"
        required: false
        default: "all"
        type: choice
        options:
          - preopen
          - afterclose
          - market_hours
          - all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine profile
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 23 * * 0-5" ]; then
            echo "profile=preopen" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/30 0-6 * * 1-5" ]; then
            echo "profile=market_hours" >> "$GITHUB_OUTPUT"
          else
            echo "profile=afterclose" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Collect
        id: collect
        continue-on-error: true # 부분 실패(예: 특정 지표 stale)가 배포를 막지 않도록 — 마지막 단계에서 job을 실패로 승격
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/collect.py --profile ${{ steps.which.outputs.profile }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "data: ${{ steps.which.outputs.profile }} sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build site
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p dist/data
          cp -r ../data/. dist/data/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Fail job if collect had errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::수집 중 실패 또는 stale 지표가 있었습니다 (배포는 완료됨). 로그를 확인하세요."
          exit 1
